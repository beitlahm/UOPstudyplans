  <style>:root {
  color-scheme: dark;
  --paper: light-dark(#f8f8f8,#080808); --card: light-dark(#eeeeee,#181818);
  --canvas: var(--paper);
  --ink: light-dark(#202020,#eeeeee); --muted: light-dark(#595959,#b2b2b2);
  --line: light-dark(#d8d8d8,#383838); --border-strong: light-dark(#747474,#909090);
  --accent: light-dark(#454545,#cecece); --accent-fill: light-dark(#454545,#373737);
  --on-accent: #fafafa; --focus: light-dark(#454545,#dedede);
  --surface-1: var(--paper); --surface-2: var(--card); --text-muted: var(--muted);
  --control: light-dark(#e8e8e8,#212121); --control-hover: light-dark(#dadada,#303030);
  font-family: "Segoe UI", Tahoma, Arial, sans-serif; line-height: 1.45;
}
:root[data-mode="dark"] {color-scheme:dark} :root[data-mode="light"] {color-scheme:light}
* {box-sizing:border-box}
body {margin:0;background:var(--paper);color:var(--ink);font-size:1rem}
h1,h2,p {margin:0} button,input,select,summary {font:inherit;color:inherit}
button,select,summary {cursor:pointer} button {background:transparent;border:0;font-weight:600}
:focus-visible {outline:3px solid var(--focus);outline-offset:3px}
[hidden] {display:none!important}
.title-actions,.preferences,.filter-tools,.view-switch,.title-row,.toolbar,.canvas-title,.guide,.key,#lg,.major-picker {display:flex;align-items:center}
.preferences {font-size:.875rem;color:var(--muted)}.preferences {gap:4px}
.preferences button {min-height:36px;min-width:36px;padding:4px 8px;color:var(--muted);background:transparent;border:0}
.preferences button:hover, .preferences button:focus-visible {color:var(--ink)}
#bt {font-family:"Segoe UI Symbol",sans-serif;font-size:1.15rem}
main {padding:18px clamp(12px,1.5vw,28px) 12px}
.title-actions {gap:10px;flex-wrap:wrap}
.title-row {justify-content:space-between;gap:14px;margin-bottom:17px}
.program {min-width:0}#major-label {font-size:.85rem;color:var(--muted);font-weight:600}
.major-picker {gap:11px;position:relative;width:fit-content;max-width:100%}
.major-picker select {position:absolute;inset:0;width:100%;height:100%;opacity:0}
.major-picker:focus-within {outline:3px solid var(--focus);outline-offset:3px;border-radius:3px}
h1 {font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.035em;line-height:1.16;font-size:clamp(1.65rem,2.5vw,2.5rem)}
:lang(ar) h1 {font-family:Tahoma,sans-serif;letter-spacing:0;font-size:clamp(1.5rem,2vw,2.15rem)}
.caret {flex:none;width:8px;height:8px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:translateY(-2px) rotate(45deg);color:var(--muted);pointer-events:none}
.track-button {border-radius:7px;border:1px solid var(--accent-fill);background:var(--accent-fill);color:var(--on-accent);min-height:40px;padding:8px 14px;font-weight:600;font-size:.9rem;flex:none}
.track-button::before {content:"";display:inline-block;width:10px;height:10px;border:1.4px solid currentColor;border-radius:3px;margin-inline-end:8px}
.track-button[aria-pressed=true]::before {content:"✓";font-size:11px;line-height:10px;vertical-align:1px}
.toolbar {justify-content:space-between;gap:10px;flex-wrap:wrap;padding:2px 0}
.view-switch {gap:4px}
.view-switch button {font-size:.875rem;min-height:32px;border-radius:5px;padding:4px 11px;color:var(--muted);border:0;background:var(--control)}
.view-switch button[aria-pressed=true] {color:var(--on-accent);background:var(--accent-fill)}
.filter-tools {gap:8px;min-width:0}.search-field,.filter-field {height:36px;display:flex;align-items:center;position:relative;background:var(--card);border:0;border-radius:6px}
.search-field {max-width:100%;width:clamp(170px,20vw,260px);padding-inline-start:12px}
.glass {width:12px;height:12px;border:1.5px solid var(--muted);border-radius:50%;position:relative;flex:none}
.glass::after {content:"";background:var(--muted);position:absolute;width:6px;height:1.5px;transform:rotate(45deg);top:10px;left:8px}
input,select {background:var(--card);font-size:.875rem} input {width:100%;min-width:0;border:none;padding:4px 10px;height:100%;border-radius:6px}input::placeholder {color:var(--muted)}
.search-field:focus-within {outline:3px solid var(--focus)}.search-field input:focus {outline:0}
.filter-field select {appearance:none;border:0;border-radius:6px;height:100%;width:100%;padding-inline:11px 30px}.filter-field .caret {position:absolute;inset-inline-end:11px;width:6px;height:6px}
#rs {font-size:.875rem;font-weight:500;color:var(--muted);min-height:36px;border-radius:5px}
.canvas-title {padding:13px 0 0;gap:9px;flex-wrap:wrap}h2 {font-size:1.05rem;letter-spacing:-.015em}
#results {color:var(--muted);font-size:.8rem;border-inline-start:1px solid var(--line);padding-inline-start:9px}
.guide {align-items:flex-start;gap:7px;margin:3px 0 6px;font-size:.875rem;color:var(--muted)}
.info-symbol {font:bold .75rem/15px Georgia,serif;width:16px;height:16px;border:1px solid var(--border-strong);border-radius:50%;text-align:center;flex:none;margin-top:2px}
.guide>div {flex:1;min-width:0}.guide p,.guide details {display:inline}.guide details[open] {display:block}
.guide summary {display:inline-block;color:var(--accent);text-decoration:underline;text-underline-offset:3px;margin-inline-start:6px}
.guide details[open] summary {margin:4px 0}.guide details[open] p {display:block;margin-bottom:5px}.guide [role=status] {overflow-wrap:anywhere}
#diagram {overflow-x:auto;scroll-padding:8px;scrollbar-color:var(--border-strong) var(--paper)}
#diagram svg {display:block;width:100%;height:auto;user-select:none}.th,.ts {fill:var(--muted);font-size:13px}.th {fill:var(--ink);font-weight:600}
.stage-label {font-size:13px;fill:var(--muted);font-weight:600;letter-spacing:.025em}

.node,.course-card {--bg:var(--card);--fg:var(--ink);--edge:light-dark(#a3a3a3,#494949)}
.c-purple {--bg:light-dark(#eee9fb,#332c46);--fg:light-dark(#4e387d,#ecdefe);--edge:light-dark(#9983c5,#9580b5)}
.c-pink {--bg:light-dark(#fae7ee,#492e39);--fg:light-dark(#793853,#ffdae7);--edge:light-dark(#c38ba0,#b4738b)}
.c-coral {--bg:light-dark(#f9e9df,#422e26);--fg:light-dark(#753b24,#ffd9c5);--edge:light-dark(#c98f70,#ab7a61)}
.c-amber {--bg:light-dark(#ffe7b4,#543d15);--fg:light-dark(#6d4100,#ffe4a5);--edge:light-dark(#b37a1c,#e8ba62)}
.c-blue {--bg:light-dark(#e2eefb,#20384f);--fg:light-dark(#214e7b,#d7ecff);--edge:light-dark(#698cb4,#75a3c7)}
.c-teal {--bg:light-dark(#dff1e9,#213d34);--fg:light-dark(#195742,#dbf7e8);--edge:light-dark(#689b82,#7baf92)}
.c-green {--bg:light-dark(#e4efd8,#304229);--fg:light-dark(#345628,#e5f8d9);--edge:light-dark(#75945e,#90ac76)}
.node {cursor:pointer}.node rect {fill:var(--bg);stroke:var(--edge);stroke-width:1}.node text {fill:var(--fg);pointer-events:none}.node .th {font-size:14px;font-weight:600}.node .ts {font:12px Consolas,monospace}.node .course-state {font-size:12px}
.node.nonmatch rect {stroke-dasharray:2 4;fill:var(--canvas)}.node.related rect,.node:hover rect {stroke-width:2}.node:focus-visible {outline:none}.node:focus-visible rect {stroke:var(--focus);stroke-width:3}
.key {gap:16px;align-items:baseline;padding:2px 0 9px;font-size:.8rem;color:var(--muted)}#key-label {font-weight:650;color:var(--ink);white-space:nowrap}#lg {gap:4px 15px;flex-wrap:wrap}
.metrics {gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:6px 0}
.metrics>div {flex:1 1 100px;border-inline-start:1px solid var(--line);padding-inline:12px}.metrics>div:first-child {border:none}
.metrics span {font-size:.8rem;color:var(--muted)}.metrics strong {display:block;font-size:1.1rem;direction:ltr;text-align:match-parent;font-variant-numeric:tabular-nums}
#course-list {display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,265px),1fr));gap:10px;padding:5px 0}
.course-card {position:relative;background:var(--bg);border:1px solid var(--edge);border-radius:8px;padding:11px 13px}
.course-card button {font-size:1rem;text-align:start;padding:0;color:var(--fg)}.course-card button::after {content:"";position:absolute;inset:0}.course-card:focus-within {outline:3px solid var(--focus)}
.course-card p {font-size:.825rem;color:var(--fg);overflow-wrap:anywhere;margin-top:4px}.course-card p:empty {display:none}.course-card .code {font-variant-numeric:tabular-nums}.course-card .status {font-weight:650}
footer {color:var(--muted);font-size:.8rem;margin-top:9px}.skip,.sr-only {position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}.skip:focus {clip-path:none;width:auto;height:auto;top:4px;left:8px;background:var(--card);padding:8px;z-index:10}
@media(max-width:740px){.toolbar {align-items:stretch}.filter-tools {flex:1 1 100%}.search-field {flex:1}main {padding-top:13px}.title-row {margin-bottom:12px}.key {gap:8px;flex-wrap:wrap}.key #lg {gap:4px 10px}.metrics>div {flex-basis:27%}}
@media(max-width:480px){.title-row {align-items:flex-start;flex-wrap:wrap;gap:7px}.track-button {min-height:35px;padding:6px 10px}.toolbar {padding:2px 0}.filter-tools {gap:5px}.filter-field {max-width:37%}.canvas-title {padding:9px 0 0}.guide {margin:4px 0 8px}.key {padding:3px 0 7px}}
@media(forced-colors:active){.node rect {fill:Canvas!important;stroke:CanvasText!important}.node text {fill:CanvasText!important}.node:focus-visible rect {stroke:Highlight!important}}


#rs {background:var(--control);color:var(--ink);padding-inline:10px}
#rs:hover, .view-switch button:hover {background:var(--control-hover)}
.track-button:hover, .track-button[aria-pressed=true], .view-switch button[aria-pressed=true]:hover {background:#505050;color:#fff}
.filter-field select {background:var(--control)}
.node .th {font-size:13px}
.node .ts {opacity:.82}
.node .course-state {font-size:10px}
@media(max-width:540px) {
  .title-row {flex-wrap:wrap}
  .title-actions {gap:7px}
}
</style>
</head>
<body>

<p id="progress-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
<div id="vis-container">
  <main id="workspace" tabindex="-1">
    <div class="title-row">
      <div class="program"><label for="mj" id="major-label">Study plan</label><div class="major-picker"><h1 id="degree-heading">Computer Science</h1><span class="caret" aria-hidden="true"></span><select id="mj"></select></div></div>
      <div class="title-actions">
        <button id="m2" class="track-button" aria-pressed="false">Track my progress</button>

    <section id="mx" class="metrics" aria-label="Progress summary" style="display:none">
      <div><span id="l0"></span><strong><b id="v0">0</b> / <b id="vT">0</b></strong></div>

      <div class="canvas-title"><h2 id="plan-title">Course prerequisites</h2><span id="results" role="status" aria-live="polite"></span></div>
      <div class="guide"><span class="info-symbol" aria-hidden="true">i</span><div><p id="brief"></p><details id="details"><summary id="detail-title">Details</summary><p id="info" role="status" aria-live="polite" aria-atomic="true"></p><p id="keyboard-help"></p></details></div></div>
      <div class="key"><span id="key-label">Map key</span><div id="lg"></div></div>
      <div id="diagram" dir="ltr" tabindex="0" role="region" aria-label="Course prerequisite diagram" aria-describedby="keyboard-help"><svg id="g" role="group" aria-labelledby="chart-title chart-desc" style="direction:ltr"><title id="chart-title">Course prerequisites</title><desc id="chart-desc"></desc><defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><g id="root"></g></svg></div>
      <div id="course-list" hidden></div>
    </section>
    <footer id="footer"></footer>
  </main>
</div>
<script>
const mk=(rows,type,cat,grp)=>rows.map(r=>({id:r[0],en:r[1],ar:r[2],cr:r[3],pre:r[4],arFull:r[5]||r[2],hrs:r[6]||0,type,cat,grp:grp||null}));
const FAC=[
["103101","Calculus (1)","تفاضل وتكامل (1)",3,[]],
["103250","Discrete Math (1)","رياضيات متقطعة (1)",3,["103101"]],
["603391","Systems Analysis","تحليل الأنظمة",3,["601282"],"تحليل الأنظمة وتصميمها"],
["402201","Comm. Skills (IT)","مهارات الاتصال (IT)",3,["9400123"],"مهارات الاتصال لتكنولوجيا المعلومات"],
["605161","Intro to Networking","مدخل إلى الشبكات",3,["601105","603102"],"مدخل الى الشبكات وتراسل البيانات"],
["603460","Professional Ethics","الأخلاقيات المهنية",1,["603391"],"الأخلاقيات المهنية في تكنولوجيا المعلومات"],

const UMAIN=[["9400123","English Comm. 1","اتصال بالإنجليزية (1)",3,[],"مهارات الاتصال والتواصل باللغة الانجليزية (1)"]];
const ULOW=[

["9400113","Arabic Comm. 1","اتصال بالعربية (1)",3,[],"مهارات الاتصال والتواصل باللغة العربية (1)"],
["9300105","Entrep. & Innovation","الريادة والابتكار",2,[]],
["9400107","Leadership & Social","القيادة والمسؤولية",2,[],"القيادة والمسؤولية المجتمعية"],
["9400108","Life Skills","المهارات الحياتية",2,[]],
["9400110","Military Science","العلوم العسكرية",3,[]]];
const U1=[
["9700102","Human Rights","حقوق الانسان",3,[]],
["9400104","Political Science","علوم سياسية",3,[]],
["9400114","Arabic Comm. 2","اتصال بالعربية (2)",3,["9400113"],"مهارات الاتصال والتواصل باللغة العربية (2)"],
["9400124","English Comm. 2","اتصال بالإنجليزية (2)",3,["9400123"],"مهارات الاتصال والتواصل باللغة الانجليزية (2)"],
["9400133","Jerusalem & Palest.","القدس والقضية",3,[],"القدس والقضية الفلسطينية"],

const U2=[

["9100101","Science & Life","العلم والحياة",3,[]],

["9600104","Digital Skills","الثقافة الرقمية",3,[]],
["9200102","Development & Env.","التنمية والبيئة",3,[]]];
const U3=[["ANY3","Any 3hr course","مادة حرة (3 ساعات)",3,[],"مادة حرة (أي مادة 3 ساعات)"]];

</script><script>// Presentation and accessibility only. All actions use the original planner functions.
const extraText={en:{eyebrow:'UNIVERSITY OF PETRA · FACULTY OF INFORMATION TECHNOLOGY',title:'Your degree, course by course.',intro:'Explore prerequisites or track the courses you have completed.',major:'Your major',search:'Find a course',filter:'Show',details:'Course information',plan:'Course prerequisites',map:'THE STUDY PLAN',diagram:'Diagram',list:'Course list',help:'Tab to a course, then press Enter or Space. Arrow keys move between courses. Scroll sideways to explore stages.',footer:'Progress is kept only while this page stays open. Stages show prerequisite order, not a semester schedule.',needed:'Prerequisite',full:'Fully unlocked',partial:'Partly unlocked',selected:'Selected',locked:'Not available yet',external:'Credits not listed',match:'matching courses',nonmatch:'Outside current search or filter',none:'None',prereq:'Prerequisites',hours:'Credit hours',choose:'Select course',complete:'Mark complete',undo:'Undo completion',desc:'Courses grouped by prerequisite stage. Each course is a button. An equivalent course list is available.'},ar:{eyebrow:'جامعة البترا · كلية تكنولوجيا المعلومات',title:'خطتك الدراسية، مقررًا بمقرر.',intro:'استكشف المتطلبات السابقة أو تتبّع المقررات التي أنجزتها.',major:'تخصصك',search:'ابحث عن مقرر',filter:'عرض',details:'معلومات المقرر',plan:'متطلبات المقررات',map:'الخطة الدراسية',diagram:'المخطط',list:'قائمة المقررات',help:'انتقل إلى المقرر بمفتاح Tab، ثم اضغط Enter أو المسافة. استخدم الأسهم للتنقل بين المقررات، ومرّر أفقيًا لاستكشاف المراحل.',footer:'يُحفظ التقدم فقط أثناء بقاء الصفحة مفتوحة. تشير المراحل إلى ترتيب المتطلبات السابقة، وليست جدولًا للفصول الدراسية.',needed:'متطلب سابق',full:'يُفتح بالكامل',partial:'يُفتح جزئيًا',selected:'محدد',locked:'غير متاح بعد',external:'الساعات غير مذكورة',match:'مقررات مطابقة',nonmatch:'خارج البحث أو التصفية الحالية',none:'لا يوجد',prereq:'المتطلبات السابقة',hours:'ساعات معتمدة',choose:'تحديد المقرر',complete:'تعليم كمُنجَز',undo:'التراجع عن الإنجاز',desc:'مقررات مرتبة حسب مراحل المتطلبات السابق function formatCourseName(n) {

function positionCourseLabels(n, hasStatus) {
  n.t1.setAttribute('y', n.y + (hasStatus ? 9 : 13));

function courseStatus(n){const x=X();if(mode==='t'){if(done.has(n.id))return T().done;if(!canPick(n))return T().limit(gdone(n.grp).length,T().GN[n.grp]);if(avail(n,sums().t))return T().avail;return n.ext?x.external:x.locked}if(n.id===sel)return x.selected;if(sel&&N[sel]){if(up(sel,new Set()).has(n.id))return x.needed;if(dn(sel,new Set()).has(n.id))return n.r.hasAttribute('stroke-dasharray')?x.partial:x.full}return n.ext?x.external:n.el?(n.uni?T().lg[2]:T().lg[1]):n.uni?T().lg[0]:''}

  document.querySelector('.view-switch').setAttribute('aria-label', arabic ? 'طريقة العرض' : 'View');
  document.querySelector('.skip').textContent = arabic ? 'انتقل إلى الخطة الدراسية' : 'Skip to study plan';
  $('mx').setAttribute('aria-label', arabic ? 'ملخص التقدم' : 'Progress summary');
}

function refreshSummary(matches) {
  const arabic = lang === 'ar';
  const total = Object.keys(N).length;
  $('degree-heading').textContent = MAJORS[majKey][lang];
  $('results').textContent = q || flt !== 'all'

}

function accessibleRender(){const x=X();if(mode==='t'){const summary=sums();$('progress-announcement').textContent=lang==='ar'?'المقررات المنجزة: '+summary.k+'، مجموع الساعات: '+summary.t:'Completed courses: '+summary.k+'. Total credits: '+summary.t;}else $('progress-announcement').textContent='';let matches=0;Object.values(N).forEach(n=>{const status=courseStatus(n);if(!n.g.classList.contains('nonmatch'))matches++;const action=mode==='t'?(done.has(n.id)?x.undo:x.complete):x.choose;const name=nm(n.id)+' ('+n.id+'), '+(n.cr===null?x.external:n.cr+' '+x.hours)+(status?', '+status:'')+'. '+action;n.g.setAttribute('aria-label',name);n.g.setAttribute('aria-pressed',mode==='t'?String(done.has(n.id)):String(sel===n.id));if(!n.statusLabel)n.statusLabel=el('text',{x:n.x+W/2,y:n.y+36,class:'course-state','text-anchor':'middle','font-size':12},n.g);n.statusLabel.textContent = status.length > 27 ? (lang === 'en' ? 'Limit reached' : 'اكتمل الحد') : status;positionCourseLabels(n, Boolean(status));n.g.setAttribute('aria-describedby','keyboard-help');});refreshSummary(matches);
if(lastListMajor!==majKey){$('course-list').replaceChildren();Object.values(N).forEach(n=>{const card=document.createElement('article');card.className='course-card';card.dataset.course=n.id;const button=document.createElement('button');button.addEventListener('click',()=>click(n.id));card.append(button);for(const cls of ['code','status','prereq','matching']){const p=document.createElement('p');p.className=cls;card.append(p)}$('course-list').append(card)});lastListMajor=majKey}
document.querySelectorAll('.course-card').forEach(card=>{const n=N[card.dataset.course];card.className = n.g.getAttribute('class').replace('node','course-card');const b=card.querySelector('button');b.textContent=full(n);b.setAttribute('aria-label',n.g.getAttribute('aria-label'));b.setAttribute('aria-pressed',n.g.getAttribute('aria-pressed'));const code=card.querySelector('.code');code.replaceChildren();const id=document.createElement('bdi');id.dir='ltr';id.textContent=n.id;code.append(id,document.createTextNode(' · '+(n.cr===null?x.external:n.cr+' '+x.hours)));card.querySelector('.status').textContent=courseStatus(n);card.querySelector('.prereq').textContent=x.prereq+': '+(n.pre.map(i=>nm(i)+' ('+i+')').join('، ')||x.none)+(n.hrs?' · '+T().hrsNeed(n.hrs,sums().t):'');card.querySelector('.matching').textContent=n.g.classList.contains('nonmatch')?x.nonmatch:''});}
