:root,

[data-mode="dark"]:not(:root) {

}
@media (prefers-color-scheme: dark) {
  [data-mode="system"]:not(:root) {

  }
}
:root {
  color-scheme: light dark;
  --font-serif: "anthropic-serif", Georgia, "Times New Roman", serif;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
input,
select,
textarea,
button {
  font-family: inherit;
}
body {
  font-family:
    "anthropic-sans",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: transparent;
}
html:where(:not([data-saved])),
:where(html:not([data-saved])) body {
  scrollbar-width: none;
}
html:where(:not([data-saved]))::-webkit-scrollbar,
:where(html:not([data-saved])) body::-webkit-scrollbar {
  width: 0;
  height: 0;
}
:root {
  --p: var(--text-primary);
  --s: var(--text-secondary);
  --t: var(--text-muted);
  --bg2: var(--surface-1);
  --b: var(--border-strong);
}
.t {
  font-size: 14px;
  fill: var(--p);
}
.ts {
  font-size: 12px;
  fill: var(--s);
}
.th {
  font-size: 14px;
  fill: var(--p);
  font-weight: 500;
}
.box {
  fill: var(--bg2);
  stroke: var(--b);
}
.arr {
  stroke: var(--t);
  fill: none;
  stroke-width: 1.5;
}
.node {
  cursor: pointer;
}
.node:hover rect,
.node:hover .box {
  filter: brightness(0.97);
}
.node:hover text {
  opacity: 0.8;
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not(
    form.elicit *
  ),
select:not(form.elicit *),
textarea:not(form.elicit *) {
  --input-font-size: max(16px, var(--font-text-md-size, 16px));
  width: 100%;
  height: calc(var(--input-font-size) * 2.25);
  padding: 8px 12px;
  font-size: var(--input-font-size);
  background: var(--surface-2);
  color: var(--text-primary);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  outline: none;
  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}
textarea {
  height: auto;
  min-height: 80px;
  resize: vertical;
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not(
    form.elicit *
  ):hover,
select:not(form.elicit *):hover,
textarea:not(form.elicit *):hover {
  border-color: var(--border-strong);
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not(
    form.elicit *
  ):focus,
select:not(form.elicit *):focus,
textarea:not(form.elicit *):focus {
  border-color: var(--border-accent);
  box-shadow: 0 0 0 3px var(--bg-accent);
}
select {
  cursor: pointer;
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.1));
  border-radius: 2px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  cursor: pointer;
  transition:
    border-color 0.15s,
    transform 0.15s;
}
input[type="range"]:hover::-webkit-slider-thumb {
  border-color: var(--border-stronger);
  transform: scale(1.1);
}
input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  cursor: pointer;
}
button:not(#action-btns button):not(form.elicit button) {
  padding: 8px 16px;
  font-size: var(--font-text-sm-size, 14px);
  background: transparent;
  color: var(--text-primary);
  border: 0.5px solid var(--border-strong);
  border-radius: var(--radius);
  cursor: pointer;
  transition:
    background 0.15s,
    transform 0.1s;
}
button:not(#action-btns button):not(form.elicit button):hover {
  background: var(--surface-1);

form.elicit {
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.04);
  margin: 4px 20px 24px;
  overflow: hidden;
  font-family: var(--font-sans);
  font-size: var(--font-text-sm-size, 14px);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition:
    background-color 200ms ease-out,
    box-shadow 200ms ease-out,
    border-radius 200ms ease-out,
    padding 200ms ease-out,
    margin 200ms ease-out;
  --elicit-border-faint: color-mix(in srgb, var(--border) 25%, transparent);
  --elicit-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}
form.elicit :is(button, input, textarea) {
  font: inherit;
}
form.elicit .elicit-header,
form.elicit .elicit-question {
  font-family: var(--font-voice);
  font-size: var(--font-text-md-size, 16px);
  font-weight: 400;
  line-height: 1.5;

form.elicit .elicit-header {
  display: flex;
  align-items: center;
  gap: 8px;
  height: calc(var(--font-text-md-size, 16px) * 2.75);
  padding: 0 16px;
  border-bottom: 0.5px solid var(--border);
}
form.elicit .elicit-header > svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  fill: currentColor;
}
form.elicit .elicit-header > span {
  flex: 1;
}
form.elicit .elicit-body {
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}
form.elicit .elicit-group {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
form.elicit .elicit-question {
  margin: 0;
}
form.elicit .elicit-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;

form.elicit .elicit-pill {
  padding: 8px 12px;
  border: 0.5px solid var(--border);
  border-radius: 9999px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition:
    border-color 120ms ease,
    background-color 120ms ease;
}
form.elicit .elicit-pill:hover {
  border-color: var(--border-strong);
}
form.elicit .elicit-pill[data-accent="warning"] {
  border-color: var(--text-warning);
  background: color-mix(in srgb, var(--text-warning) 15%, transparent);
  color: var(--text-warning);
}
form.elicit .elicit-pill[data-accent="danger"] {
  border-color: var(--text-danger);
  background: color-mix(in srgb, var(--text-danger) 15%, transparent);
  color: var(--text-danger);
}
form.elicit .elicit-pill[data-accent="success"] {
  border-color: var(--text-success);
  background: color-mix(in srgb, var(--text-success) 15%, transparent);
  color: var(--text-success);
}
form.elicit .elicit-pill[aria-pressed="true"] {
  border: 0.5px solid var(--text-accent);
  background: color-mix(in srgb, var(--text-accent) 15%, transparent);
  color: var(--text-accent);
}
form.elicit .elicit-other {

form.elicit .elicit-other[hidden] {

form.elicit .elicit-textarea {

function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||root).appendChild(e);return e}
function reg(e,f){lab.push([e,f]);e.textContent=f()}
function wrap(s,m){const o=[];let c='';s.split(' ').forEach(w=>{if((c+' '+w).trim().length>m&&c){o.push(c);c=w}else c=(c+' '+w).trim()});if(c)o.push(c);return o}
function fit(t,max){try{t.removeAttribute('textLength');let fs=12;t.style.fontSize=fs+'px';let l=t.getComputedTextLength();
while(l>max&&fs>9.5){fs-=0.5;t.style.fontSize=fs+'px';l=t.getComputedTextLength()}
if(l>max){t.setAttribute('textLength',max);t.setAttribute('lengthAdjust','spacingAndGlyphs')}}catch(e){}}
const nm=i=>lang==='ar'?N[i].ar:N[i].en;
const full=n=>n.id==='ANY3'?T().any3:(lang==='ar'?n.arFull:n.en);
const base=n=>n.ext?'':(n.el?(n.uni?' c-pink':' c-purple'):(n.uni?' c-coral':' c-gray'));
const gdone=g=>[...done].filter(i=>N[i]&&N[i].grp===g);
const canPick=n=>!n.grp||done.has(n.id)||gdone(n.grp).length<LIM[n.grp];
function up(i,s){N[i].pre.forEach(p=>{if(!s.has(p)){s.add(p);up(p,s)}});return s}
function dn(i,s){N[i].suc.forEach(p=>{if(!s.has(p)){s.add(p);dn(p,s)}});return s}
function build(){
while(root.firstChild)root.removeChild(root.firstChild);lab.length=0;edges=[];memo={};
N={};[...SHARED,...MAJORS[majKey].rows].forEach(r=>{const t=r.type;N[r.id]={id:r.id,en:r.en,ar:r.ar,arFull:r.arFull,cr:r.cr,hrs:r.hrs,pre:r.pre.slice(),ext:t===2,el:t===1||t===5,uni:t>=3,low:t>=4,grp:r.grp,suc:[]}});
const ov=MAJORS[majKey].ov||{};Object.keys(ov).forEach(k=>{if(N[k])N[k].pre=ov[k].slice()});
Object.values(N).forEach(n=>{n.pre=n.pre.filter(p=>N[p])});
Object.values(N).forEach(n=>n.pre.forEach(p=>N[p].suc.push(n.id)));
Object.values(N).forEach(n=>n.sm=n.suc.filter(i=>!N[i].low));
const MAIN=Object.values(N).filter(n=>!n.low).map(n=>n.id);
const lv=i=>{if(memo[i]!==undefined)return memo[i];const p=N[i].pre;return memo[i]=p.length?1+Math.max(...p.map(lv)):0};
MAIN.forEach(lv);
const L=Math.max(...Object.values(memo))+1;const cols=Array.from({length:L},()=>[]);
MAIN.slice().sort().forEach(i=>cols[memo[i]].push(i));
const pos={};const idx=()=>cols.forEach(c=>c.forEach((i,k)=>pos[i]=k));idx();
const mean=(a,def)=>a.length?a.reduce((s,i)=>s+pos[i],0)/a.length:def;
for(let r=0;r<4;r++){for(let l=1;l<L;l++){cols[l].sort((a,b)=>mean(N[a].pre,pos[a])-mean(N[b].pre,pos[b]));idx()}
for(let l=L-2;l>=0;l--){cols[l].sort((a,b)=>mean(N[a].sm,pos[a])-mean(N[b].sm,pos[b]));idx()}}
const maxR=Math.max(...cols.map(c=>c.length));
const yDiv=TOP+maxR*RS+14,y0=yDiv+62;const lowRows=Math.max(...BLK.map(b=>b.length));
const TW=Math.max(L,BLK.length)*CS,TH=y0+lowRows*RS+40;svg.setAttribute('viewBox','0 0 '+TW+' '+TH);svg.setAttribute('width',TW);svg.setAttribute('height',TH);
cols.forEach((c,l)=>{const x=M+l*CS;reg(el('text',{x:x+W/2,y:16,'text-anchor':'middle',class:'ts'}),()=>T().stage+' '+(l+1));
const off=Math.floor((maxR-c.length)/2)*RS;c.forEach((i,k)=>{N[i].x=x;N[i].y=TOP+off+k*RS})});
const ln=el('line',{x1:M,x2:TW-M,y1:yDiv,y2:yDiv,'stroke-width':0.5});ln.style.stroke='var(--border-strong)';
reg(el('text',{x:M,y:yDiv+24,class:'th'}),()=>T().uniTitle);
BLK.forEach((b,c)=>{const x=M+c*CS;reg(el('text',{x:x+W/2,y:y0-14,'text-anchor':'middle',class:'ts'}),()=>T().blk[c]);b.forEach((i,k)=>{N[i].x=x;N[i].y=y0+k*RS})});
[0,1].forEach(a=>{const t=el('text',{x:M+W/2,y:y0+6*RS+4+a*14,'text-anchor':'middle',class:'ts'});t.style.fontSize='11px';reg(t,()=>T().note[a])});
[0,1,2,3,4].forEach(a=>{const t=el('text',{x:M+3*CS+W/2,y:y0+H+16+a*14,'text-anchor':'middle',class:'ts'});t.style.fontSize='11px';reg(t,()=>wrap(T().any3,28)[a]||'')});
const cub=(a,b)=>{const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2;const dx=Math.max(30,(x2-x1)/2);return 'M'+x1+' '+y1+'C'+(x1+dx)+' '+y1+','+(x2-dx)+' '+y2+','+(x2-2)+' '+y2};
const route=(a,b,k)=>{const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2;
if(a.low&&b.low)return cub(a,b);
if(b.low){const xv=x1+20;return 'M'+x1+' '+y1+'C'+(x1+10)+' '+y1+','+xv+' '+y1+','+xv+' '+(y1+10)+'L'+xv+' '+(y2-10)+'C'+xv+' '+y2+','+(xv+4)+' '+y2+','+(x2-2)+' '+y2}
if(memo[b.id]-memo[a.id]<=1)return cub(a,b);
const yc=(y1<y2?b.y-5:(y1>y2?b.y+H+5:b.y-5))+[-3,0,3][k%3];
return 'M'+x1+' '+y1+'C'+(x1+20)+' '+y1+','+(x1+20)+' '+yc+','+(x1+40)+' '+yc+'L'+(x2-40)+' '+yc+'C'+(x2-20)+' '+yc+','+(x2-20)+' '+y2+','+(x2-2)+' '+y2};
let ek=0;Object.values(N).forEach(n=>n.pre.forEach(p=>{const e=el('path',{d:route(N[p],n,ek++),fill:'none','marker-end':'url(#arrow2)'});edges.push({e,a:p,b:n.id})}));
Object.values(N).forEach(n=>{const g=el('g',{class:'node'});n.g=g;
n.r=el('rect',{x:n.x,y:n.y,width:W,height:H,rx:n.el?20:6,'stroke-width':0.5},g);
n.t1=el('text',{class:'th',x:n.x+W/2,y:n.y+14,'text-anchor':'middle','dominant-baseline':'central'},g);
n.t2=el('text',{class:'ts',x:n.x+W/2,y:n.y+29,'text-anchor':'middle','dominant-baseline':'central'},g);n.t2.style.fontSize='11px';
n.tip=el('title',{},g);g.addEventListener('click',ev=>{ev.stopPropagation();click(n.id)})});
const real=Object.values(N).filter(n=>!n.ext);const uc=real.filter(n=>n.uni&&!n.el);
coreTot=real.filter(n=>!n.el&&!n.uni).reduce((s,n)=>s+n.cr,0);slots=real.filter(n=>!n.el&&!n.uni).length+LIM.maj+uc.length+3;
const uniT=uc.reduce((s,n)=>s+n.cr,0)+9;$('vt').textContent=coreTot;$('vu').textContent=uniT;$('vn').textContent=slots;$('vT').textContent=coreTot+9+uniT;
refresh();render()}
function refresh(){lab.forEach(x=>{x[0].textContent=x[1]()});
Object.values(N).forEach(n=>{n.t1.textContent=nm(n.id);n.t2.textContent=(n.id==='ANY3'?T().anyDept:n.id)+(n.cr?' · '+n.cr+' '+T().cr:'');fit(n.t1,W-14)})}
function sums(){let c=0,u=0,k=0,m=0,t=0;done.forEach(i=>{const n=N[i];if(!n||n.ext)return;k++;t+=n.cr;if(n.uni)u+=n.cr;else if(n.grp==='maj')m++;else if(!n.el)c+=n.cr});return{c,u,k,m,t}}
const avail=(n,t)=>!n.ext&&!done.has(n.id)&&n.pre.every(p=>done.has(p))&&canPick(n)&&t>=n.hrs;
function click(id){const n=N[id];warn='';
if(mode==='x'){sel=id}else{if(done.has(id)){[id,...dn(id,new Set())].forEach(i=>done.delete(i))}
else if(!canPick(n)){warn=T().warn(T().GN[n.grp],gdone(n.grp).map(nm).join(', '),nm(id))}
else{[id,...up(id,new Set())].forEach(i=>done.add(i))}}render()}
const sw=(bg,bd,r,d)=>'<span style="display:inline-block;width:14px;height:12px;border-radius:'+r+'px;background:'+bg+';border:1.5px '+(d?'dashed':'solid')+' '+bd+'"></span>';
function legend(){const l=T().lg;const it=mode==='x'?[[sw('#D85A30','#D85A30',3),l[0]],[sw('#AFA9EC','#AFA9EC',7),l[1]],[sw('#ED93B1','#ED93B1',7),l[2]],[sw('#EF9F27','#EF9F27',3),l[3]],[sw('#378ADD','#378ADD',3),l[4]],[sw('#1D9E75','#1D9E75',3),l[5]],[sw('rgba(29,158,117,.2)','#1D9E75',3,1),l[6]],[sw('transparent','var(--text-muted)',3,1),l[7]]]:
[[sw('#639922','#639922',3),l[8]],[sw('#378ADD','#378ADD',3),l[9]],[sw('var(--surface-1)','var(--border-strong)',3),l[10]],[sw('#AFA9EC','#AFA9EC',7),l[11]]];
$('lg').innerHTML=it.map(x=>'<span style="display:inline-flex;align-items:center;gap:6px">'+x[0]+x[1]+'</span>').join('')}
function render(){const qq=q.toLowerCase();let A=null,B=null,fu=null,dd=null;const S=sums();const t=T();
if(mode==='x'&&sel&&N[sel]){A=up(sel,new Set());B=dn(sel,new Set());dd=new Set([sel,...A]);fu=new Set();let ch=true;
while(ch){ch=false;B.forEach(i=>{if(!fu.has(i)&&N[i].pre.every(p=>dd.has(p))){fu.add(i);dd.add(i);ch=true}})}}
const miss=i=>N[i].pre.filter(p=>!dd.has(p));const fo={};let av=0;
Object.values(N).forEach(n=>{let c=base(n),o=1,dash=n.ext,sw2=0.5,st='';
if(A){if(n.id===sel){c=' c-amber'}else if(A.has(n.id)){c=' c-blue'}else if(fu.has(n.id)){c=' c-teal'}
else if(B.has(n.id)){c=' c-teal';o=0.6;dash=true;sw2=1.5;st=t.also+miss(n.id).map(nm).join(', ')}else{c=' c-gray';o=0.3}}
else if(mode==='t'){if(done.has(n.id)){c=' c-green';st=t.done}
else if(!canPick(n)){o=0.35;st=t.limit(gdone(n.grp).map(nm).join(', '),t.GN[n.grp])}
else if(avail(n,S.t)){c=' c-blue';st=t.avail;av++}
else{o=0.55;if(!n.ext){const m=n.pre.filter(p=>!done.has(p)).map(nm);st=(m.length?t.needs+m.join(', '):'')+(S.t<n.hrs?(m.length?'. ':'')+t.hrsNeed(n.hrs,S.t):'')}}}
let f2=1;if(flt==='core'&&n.el)f2=0.2;if(flt==='el'&&!n.el&&!n.ext)f2=0.2;if(flt==='uni'&&!n.uni)f2=0.2;
if(qq&&!(n.en.toLowerCase().includes(qq)||n.ar.includes(q)||n.id.toLowerCase().includes(qq)))f2*=0.25;fo[n.id]=f2;
n.g.setAttribute('class','node'+c);n.g.style.opacity=o*f2;n.tip.textContent=full(n)+' ('+n.id+')'+(st?'\n'+st:'');
if(n.ext&&c===''){n.r.style.fill='none';n.r.style.stroke='var(--text-muted)'}else{n.r.style.fill='';n.r.style.stroke=''}
if(dash)n.r.setAttribute('stroke-dasharray','4 3');else n.r.removeAttribute('stroke-dasharray');n.r.setAttribute('stroke-width',sw2)});
edges.forEach(o=>{let col=null,dsh='',w=0.8,op=0.6;
if(A){if(o.b===sel||A.has(o.b))col='#378ADD';else if((o.a===sel||B.has(o.a))&&B.has(o.b)){col='#1D9E75';if(!fu.has(o.b))dsh='4 3'}
if(col){w=1.6;op=1}else op=0.15}
else if(mode==='t'){if(done.has(o.a)&&done.has(o.b)){col='#639922';w=1.4;op=1}else if(done.has(o.a)){col='#378ADD';w=1.4;op=0.9}}
op*=Math.min(fo[o.a],fo[o.b]);
o.e.style.stroke=col||'var(--border-strong)';o.e.style.strokeWidth=w;o.e.style.opacity=op;o.e.style.strokeDasharray=dsh});
const d=$('info');
if(mode==='t'){$('v0').textContent=S.t;$('v1').textContent=S.c;$('v2').textContent=S.m;$('v3').textContent=av;$('v4').textContent=S.k;$('v5').textContent=S.u;d.textContent=warn||t.trackInfo}
else if(A){const n=N[sel];const part=[...B].filter(i=>!fu.has(i));const front=part.filter(i=>N[i].pre.some(p=>dd.has(p)));
d.textContent=t.sel(nm(sel),sel,n.el,A.size,fu.size,part.length,front.map(i=>[nm(i),miss(i).map(nm).join(', ')]))}
else d.textContent=t.defInfo}
function ui(){const t=T();document.documentElement.lang=lang;$('vis-container').setAttribute('dir',lang==='ar'?'rtl':'ltr');
$('m2').textContent=t.track;$('q').placeholder=t.search;t.f.forEach((s,i)=>{$('f').options[i].textContent=s});$('rs').textContent=t.reset;
t.mx.forEach((s,i)=>{$('l'+i).textContent=s});
const sl=$('mj');const cur=majKey;sl.innerHTML='';Object.keys(MAJORS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=MAJORS[k][lang];sl.appendChild(o)});sl.value=cur;
$('bl').textContent=t.bl;$('bl').title=t.blT;legend();themeUi()}
function eff(){return theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function themeUi(){const r=document.documentElement;if(theme){r.setAttribute('data-mode',theme);r.style.colorScheme=theme}else{r.removeAttribute('data-mode');r.style.colorScheme=''}
const e=eff();$('bt').textContent=e==='dark'?'☀':'☾';$('bt').title=e==='dark'?T().btD:T().btL}
function setMode(m){mode=m;sel=null;warn='';$('m2').style.background=m==='t'?'var(--surface-2)':'transparent';$('m2').style.fontWeight=m==='t'?500:400;$('m2').setAttribute('aria-pressed',m==='t');
$('mx').style.display=m==='t'?'flex':'none';legend();render()}
$('m2').addEventListener('click',()=>setMode(mode==='t'?'x':'t'));
$('q').addEventListener('input',e=>{q=e.target.value.trim();render()});$('f').addEventListener('change',e=>{flt=e.target.value;render()});
$('mj').addEventListener('change',e=>{majKey=e.target.value;sel=null;warn='';build()});
$('rs').addEventListener('click',()=>{sel=null;warn='';done.clear();q='';$('q').value='';flt='all';$('f').value='all';render()});
$('bl').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';ui();refresh();render()});
$('bt').addEventListener('click',()=>{theme=eff()==='dark'?'light':'dark';themeUi()});
['bl','bt'].forEach(i=>{$(i).addEventListener('mouseenter',()=>{$(i).style.opacity=1});$(i).addEventListener('mouseleave',()=>{$(i).style.opacity=.8})});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeUi);
svg.addEventListener('click',()=>{sel=null;render()});
ui();build();setMode('x');
</script></div>
</body></html>
